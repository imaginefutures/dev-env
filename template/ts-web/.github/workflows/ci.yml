# 두 작업: 검사(타입·lint·경계·포맷·안 쓰는 코드·비밀값), DB를 붙인 테스트(docs/stack.md).
# action은 커밋 SHA로 고정한다(태그는 바뀔 수 있다). 올릴 때는 Dependabot이 SHA와 주석을 같이 바꾼다.
# main push와 PR에서만 돈다. pnpm 저장소를 캐시하고, 작업마다 시간 한도를 둔다(멈춘 작업이 러너를 오래 잡지 않게).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR에 새 push가 오면 돌던 실행을 취소한다. main은 끝까지 두고 기다리는 것은 가장 새 커밋 하나만 남는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:boundaries
      - run: pnpm format
      - run: pnpm knip
      - run: gitleaks git --no-banner --redact

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://dev:dev@127.0.0.1:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
